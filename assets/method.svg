<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="The Paper-First Method: Paper, Pushback, Production">
  <rect width="1100" height="340" fill="#f3ece0"/>
  <rect x="0" y="0" width="1100" height="2" fill="#c4a46a"/>
  <text x="40" y="42" fill="#b8893a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.8">THE PAPER-FIRST METHOD</text>
  <text x="40" y="78" fill="#14110e" font-family="Georgia, 'Times New Roman', serif" font-size="26">Paper.  -&gt;  Pushback.  -&gt;  Production.</text>
  <text x="40" y="106" fill="#6f685e" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">You do the thinking. The AI does the building, inside a structure a human decided.</text>
  <g>
    <rect x="40" y="132" width="320" height="128" fill="#efe6d6" stroke="#d8cfc0"/>
    <rect x="390" y="132" width="320" height="128" fill="#efe6d6" stroke="#d8cfc0"/>
    <rect x="740" y="132" width="320" height="128" fill="#efe6d6" stroke="#d8cfc0"/>
    <text x="60" y="162" fill="#b8893a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">01  PAPER</text>
    <text x="410" y="162" fill="#b8893a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">02  PUSHBACK</text>
    <text x="760" y="162" fill="#b8893a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">03  PRODUCTION</text>
    <text x="60" y="192" fill="#14110e" font-family="Georgia, 'Times New Roman', serif" font-size="16">One page, pen not keyboard.</text>
    <text x="410" y="192" fill="#14110e" font-family="Georgia, 'Times New Roman', serif" font-size="16">Make Claude disagree.</text>
    <text x="760" y="192" fill="#14110e" font-family="Georgia, 'Times New Roman', serif" font-size="16">Build inside your structure.</text>
    <text x="60" y="220" fill="#6f685e" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Flow. Journey. Architecture.</text>
    <text x="60" y="238" fill="#6f685e" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Draw the hand first.</text>
    <text x="410" y="220" fill="#6f685e" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Five questions until the page</text>
    <text x="410" y="238" fill="#6f685e" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">is honest, not pretty.</text>
    <text x="760" y="220" fill="#6f685e" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Six-line brief. Review like an</text>
    <text x="760" y="238" fill="#6f685e" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">architect, not a typist.</text>
  </g>
  <line x1="40" y1="284" x2="1060" y2="284" stroke="#d8cfc0"/>
  <g fill="#6f685e" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11">
    <text x="40" y="314">1 Paper</text>
    <text x="180" y="314">2 Pushback</text>
    <text x="340" y="314">3 Architecture</text>
    <text x="520" y="314">4 Stack</text>
    <text x="650" y="314">5 Brief</text>
    <text x="780" y="314">6 Build</text>
    <text x="910" y="314">7 Ship</text>
  </g>
</svg>
